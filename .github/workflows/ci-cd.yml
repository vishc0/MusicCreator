name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      composer:
        description: 'Composer name to generate music for'
        required: false
        default: 'Edvard Grieg'
      instruments:
        description: 'Instruments (space-separated, e.g., "piano violin")'
        required: false
        default: 'piano'
      difficulty:
        description: 'Difficulty level'
        required: false
        default: 'intermediate'
        type: choice
        options:
          - beginner
          - intermediate
          - advanced
          - expert

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Format check with black
      run: |
        black --check src/
      continue-on-error: true
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing
      continue-on-error: true
      if: always()

  generate-music:
    name: Generate Music
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate music
      env:
        HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      run: |
        python src/main.py \
          --composer "${{ github.event.inputs.composer }}" \
          --instruments ${{ github.event.inputs.instruments }} \
          --difficulty ${{ github.event.inputs.difficulty }} \
          --output-dir outputs
    
    - name: Upload generated files
      uses: actions/upload-artifact@v3
      with:
        name: compositions-${{ github.event.inputs.composer }}
        path: outputs/
        retention-days: 30
